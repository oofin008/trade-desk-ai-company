name: Setup repo labels

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create department + status labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              // Offices
              { name: 'dept:front-office',  color: '0e8a16', description: 'Owned by Front Office' },
              { name: 'dept:middle-office', color: '5319e7', description: 'Owned by Middle Office' },
              { name: 'dept:back-office',   color: 'd93f0b', description: 'Owned by Back Office' },
              { name: 'dept:cross-cutting', color: 'fbca04', description: 'Owned by Cross-cutting (security, legal)' },
              // Status
              { name: 'status:todo',         color: 'ededed', description: 'Not yet started' },
              { name: 'status:in-progress',  color: 'fef2c0', description: 'Being worked on' },
              { name: 'status:review',       color: 'c5def5', description: 'Awaiting human review' },
              { name: 'status:done',         color: '0e8a16', description: 'Complete' },
              { name: 'status:blocked',      color: 'b60205', description: 'Blocked on something' },
              // Other
              { name: 'needs-human',         color: 'd73a4a', description: 'Requires founder action' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
                console.log(`Created: ${label.name}`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Already exists: ${label.name}`);
                } else {
                  throw e;
                }
              }
            }
