name: Auto-route issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Apply department label based on title/body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();

            // Simple keyword routing. Tune over time.
            const rules = [
              { label: 'dept:front-office',  patterns: ['strategy', 'backtest', 'signal', 'execution', 'latency', 'order routing', 'connectivity', 'venue integration', 'trade', 'position', 'hedge'] },
              { label: 'dept:middle-office', patterns: ['risk limit', 'exposure', 'leverage', 'breach', 'stress test', 'kyc', 'aml', 'sanctions', 'licensing', 'compliance'] },
              { label: 'dept:back-office',   patterns: ['reconcile', 'settlement', 'treasury', 'ledger', 'tax', 'audit', 'withdrawal', 'deposit', 'banking'] },
              { label: 'dept:cross-cutting', patterns: ['key', 'custody', 'multisig', 'incident', 'contract', 'agreement', 'entity', 'jurisdiction', 'security'] },
            ];

            const labelsToAdd = new Set();
            for (const rule of rules) {
              if (rule.patterns.some(p => text.includes(p))) {
                labelsToAdd.add(rule.label);
              }
            }

            // Default to Front Office if nothing matched — the desk lead triages and routes.
            if (labelsToAdd.size === 0) labelsToAdd.add('dept:front-office');

            // Add status:todo if no status label present.
            const existingLabels = (issue.labels || []).map(l => l.name);
            if (!existingLabels.some(l => l.startsWith('status:'))) {
              labelsToAdd.add('status:todo');
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...labelsToAdd]
              });
            }

      - name: Comment with next step
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const refreshed = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            const labels = refreshed.data.labels.map(l => l.name);
            const dept = labels.find(l => l.startsWith('dept:'));
            const handler = {
              'dept:front-office': 'head-of-trading',
              'dept:middle-office': 'risk-manager',
              'dept:back-office': 'head-of-operations',
              'dept:cross-cutting': 'security-engineer'
            }[dept] || 'head-of-trading';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Routed to **${dept}** → handler: \`${handler}\`.\n\nFounder: invoke this with \`/directive Handle issue #${issue.number}\` or directly: \`Use the ${handler} agent to handle issue #${issue.number}\`.`
            });
