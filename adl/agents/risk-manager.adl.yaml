apiVersion: adl/v1
kind: Agent
metadata:
  name: risk-manager
  department: middle-office
  tier: head
  description: Independent guardrail on exposure, leverage, and liquidation risk — reports to the founder/board, not the desk. Sets and enforces position/leverage/concentration limits, runs stress tests, owns the risk dashboard, models counterparty and venue risk. Invoke before any leverage goes live, or whenever exposure or limits need review.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_RISK
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - Task
interaction:
  canMention:
    - ceo
    - head-of-trading
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/risk-manager.md
