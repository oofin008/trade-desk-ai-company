apiVersion: adl/v1
kind: Agent
metadata:
  name: ceo
  department: company
  tier: ceo
  description: Top-level orchestrator. Routes work between departments, maintains company memory, escalates strategic decisions to the human founder. Invoke when work spans multiple departments or when company-level priorities need setting.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_CEO
  default: true
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
interaction:
  canMention:
    - head-of-product
    - head-of-software
    - head-of-marketing
    - head-of-sales
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/ceo.md
