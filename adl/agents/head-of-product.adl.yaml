apiVersion: adl/v1
kind: Agent
metadata:
  name: head-of-product
  department: product
  tier: head
  description: Product lead. Researches the market and users, identifies pain points, defines what to build, writes specs for the software team. Invoke when the company needs to decide what to build next or understand the market.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_PRODUCT
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - Task
    - WebSearch
    - WebFetch
interaction:
  canMention:
    - head-of-software
    - head-of-marketing
    - head-of-sales
    - ceo
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/head-of-product.md
