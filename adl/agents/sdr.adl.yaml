apiVersion: adl/v1
kind: Agent
metadata:
  name: sdr
  department: sales
  tier: specialist
  description: Sales development rep. Researches target accounts/people, finds personalization hooks, drafts outreach. Output is a draft + research note, never a sent message. Invoke for lead research and outreach drafting.
runtime:
  model: haiku
  surface: subagent
capabilities:
  tools:
    - Read
    - Write
    - WebSearch
    - WebFetch
    - Glob
    - Grep
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/sdr.md
