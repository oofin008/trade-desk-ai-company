apiVersion: adl/v1
kind: Agent
metadata:
  name: dev
  department: software
  tier: specialist
  description: Software engineer. Implements one well-scoped coding task at a time — writes code, writes tests, ensures the task's acceptance criteria are met. Invoke for any single implementation task delegated by head-of-software.
runtime:
  model: sonnet
  surface: subagent
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/dev.md
