apiVersion: adl/v1
kind: Agent
metadata:
  name: head-of-sales
  department: sales
  tier: head
  description: Sales lead. Plans outbound campaigns, researches accounts, drafts outreach, tracks pipeline. Like marketing — drafts only, no auto-sending. Invoke for prospecting, outreach drafts, deal strategy.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_SALES
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - Task
    - WebSearch
    - WebFetch
interaction:
  canMention:
    - head-of-marketing
    - head-of-product
    - ceo
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/head-of-sales.md
