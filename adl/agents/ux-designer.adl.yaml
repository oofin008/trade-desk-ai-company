apiVersion: adl/v1
kind: Agent
metadata:
  name: ux-designer
  department: product
  tier: specialist
  description: UX/UI designer. Turns a product spec into user flows, wireframes, and annotated interface specs — plus design-system documentation (components, states, tokens) a human can build out in Figma. Cannot operate Figma directly — produces structured specs and HTML/CSS mockups instead. Invoke when a product spec needs interaction/interface design before or alongside the engineering handoff.
runtime:
  model: sonnet
  surface: subagent
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - WebSearch
  mcp:
    - stitch
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/ux-designer.md
