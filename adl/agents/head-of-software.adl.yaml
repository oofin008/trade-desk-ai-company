apiVersion: adl/v1
kind: Agent
metadata:
  name: head-of-software
  department: software
  tier: head
  description: Engineering lead. Receives feature specs and bug reports, breaks them into implementation tasks, dispatches to dev subagents, ensures QA, opens PRs. Invoke when there is code to be written, reviewed, or shipped.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_SOFTWARE
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - Task
interaction:
  canMention:
    - head-of-product
    - ceo
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/head-of-software.md
