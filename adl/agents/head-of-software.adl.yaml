apiVersion: adl/v1
kind: Agent
metadata:
  name: head-of-software
  department: software
  tier: head
  description: Engineering Principal & Solution Architect. Receives feature specs and bug reports, reviews and designs software architecture and infrastructure, aligns requirements to a fit-for-purpose tech stack, breaks them into implementation tasks, dispatches to dev subagents, ensures QA, opens PRs. Invoke when there is architecture to design, or code to be written, reviewed, or shipped.
runtime:
  model: sonnet
  surface: bot
  tokenEnv: DISCORD_TOKEN_SOFTWARE
capabilities:
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - Task
  mcp:
    - stitch
interaction:
  canMention:
    - head-of-product
    - ceo
  handoffVia: github-issue
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/head-of-software.md
