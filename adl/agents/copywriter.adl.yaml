apiVersion: adl/v1
kind: Agent
metadata:
  name: copywriter
  department: marketing
  tier: specialist
  description: Drafts marketing copy — landing pages, blog posts, social posts, email sequences, ad copy. Always drafts, never publishes. Invoke for any specific writing task from head-of-marketing.
runtime:
  model: sonnet
  surface: subagent
capabilities:
  tools:
    - Read
    - Write
    - WebSearch
    - Glob
    - Grep
guardrails:
  draftsOnly: true
  inherits:
    - company-hard-rules
prompt:
  body: prompts/copywriter.md
